    tarball_url: https://api.github.com/repos/zzanehip/The-OldOS-Project/tarball/2.0_1
    zipball_url: https://api.github.com/repos/zzanehip/The-OldOS-Project/zipball/2.0_1
    body: "2.0 (1):\r

      \r

      Where to begin. This update, and my goal with it, is to bring the project back from the dead
      so to speak. In doing so, the codebase has been retooled and refactored, APIs have been
      restored, and compilation errors have been resolved. In the same vein, all (or maybe most?)
      bugs related to changes in iOS/Swift/SwiftUI over the past few years have been resolved. My
      goal is to put a new foundation in place to begin building on top of again. In other words,
      2.0 returns OldOS to how it once was (and improves it perhaps too)."
