    body: "### Added\r

      \r

      - Introduce src/app/ for cross-domain orchestration
      (https://github.com/rainbow-me/rainbow/pull/7602)\r

      \r

      ### Changed\r

      \r

      - Vendor the forked react-native-shadow-stack
      (https://github.com/rainbow-me/rainbow/pull/7607)\r

      - Move bluetooth permissions into the framework module
      (https://github.com/rainbow-me/rainbow/pull/7604)\r

      - Move useHardwareBack into the framework module
      (https://github.com/rainbow-me/rainbow/pull/7606)\r

      - Upgrade React Native to 0.81.6 (https://github.com/rainbow-me/rainbow/pull/7366)\r

      - Extract useWatcher from useTransactionWatcher
      (https://github.com/rainbow-me/rainbow/pull/7610)\r

      - Bump iOS and Android to v2.0.37 (https://github.com/rainbow-me/rainbow/pull/7612)\r

      - Increment versionCode (https://github.com/rainbow-me/rainbow/pull/7638)\r

      - Reinstate custom Polymarket fees (https://github.com/rainbow-me/rainbow/pull/7635)\r

      \r

      ### Fixed\r

      \r

      - Filter remaining benign Branch noise from Sentry
      (https://github.com/rainbow-me/rainbow/pull/7603)\r

      - Fix activity list issues (https://github.com/rainbow-me/rainbow/pull/7572)\r

      - Fix(graphql): codegen parse failure on arc's updated schema
      (https://github.com/rainbow-me/rainbow/pull/7617)\r

      - Fix unstripped native libraries in release builds
      (https://github.com/rainbow-me/rainbow/commit/06adcccd90bde4208324facc608c668246496137)\r

      - Fix: temp disable App Store rating prompt (https://github.com/rainbow-me/rainbow/pull/7633)"
