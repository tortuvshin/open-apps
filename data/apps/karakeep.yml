    body: "Welcome to the `0.32.0` release of Karakeep! The mobile app is getting a major redesign by
      @esimkowitz so that it feels more native and friendly to use. Our long-overdue Safari
      extension is now available on the app store. Karakeep is now more AI-agents friendly with an
      official skill, revamped and more powerful CLI, granular API keys (and more coming in the next
      release). SingleFile is now integrated inside the karakeep extension itself for better
      crawling of authenticated pages. Keyboard shortcuts for faster actions across the app. And
      tons of fixes!\r

      \r

      This release has a huge list of contributors. Some frequent faces, and many contributing their
      first PRs. Thanks @esimkowitz, @Mxrk, @beluga73, @Ahmed-Abdel-karim, @GSAlex, @cinconueves,
      @keslerm, @xingzihai, @howwohmm, @vbalko-claimate, @MaximePinot, @apo-mak, @NikhilChowdhury27,
      @maxim-mityutko, @xuatz, @ir31k0, @Joly0, @larsborn, @venku122, @lmgarret, @hoilc, @zerone0x,
      @mrInvincible29, @Go2Engle, @faximan.\r

      \r

      *Note: the changes mentioned here for the extension and mobile releases will need to go
      through the different store (apple, google, mozilla) reviews. So it might take a couple of
      days until all of them are released.*\r

      \r

      > If you enjoy using Karakeep, consider supporting the project [here
      ☕️](https://buymeacoffee.com/mbassem) or via GitHub
      [here](https://github.com/sponsors/MohamedBassem). Also share Karakeep's managed offering (☁️
      [link](https://cloud.karakeep.app)) to your friends who're not into selfhosting. We're
      offering yearly subscriptions now.\r

      \r

      <a href=\"https://www.buymeacoffee.com/mbassem\" target=\"_blank\"><img
      src=\"https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png\" alt=\"Buy Me A Coffee\"
      width=\"auto\" height=\"50\" ></a>\r

      \r

      \r

      # New Features 🚀\r

      \r

      * Karakeep's **Safari extension** is now available on the App Store
      ([link](https://apps.apple.com/gb/app/karakeep-app/id6479258022?platform=mac)), closing
      Karakeep's oldest open issue (#10).\r

      * Huge **mobile app revamp lead by @esimkowitz**:\r

      \  * More native screens, headers and action buttons by @esimkowitz (#2685)\r

      \  * Customizable reader toolbar by @esimkowitz (#2527)\r

      \  * Add ability to keep screen on for bookmark reading by @esimkowitz (#2691)\r

      \  * Opening links in the reader view now opens them in an in-app browser so that you can
      quickly go back to where you left by @esimkowitz (#2696)\r

      \  * Add ability to default open links in external browser by @xingzihai (#2516)\r

      * **Karakeep for Agentic usage**: Our goal is to make Karakeep very AI agents friendly. This
      will allow agents (OpenClaw, Hermes, etc) to find and hoard interesting content on your
      behalf, provide weekly digests, and more.\r

      \  * We're publishing an official skill for karakeep on ClawHub and skills.sh (details
      [here](https://docs.karakeep.app/next/integrations/agentic-skills)). Those skills teach the
      agent karakeep's concepts and how to use the CLI.\r

      \  * CLI improvements:\r

      \    * The CLI also got major improvements allowing it to manage more aspects for bookmarks,
      lists, and tags. Also got more AI friendly formatting, etc.\r

      \    * To avoid having to pass the address and API key with every request, karakeep can now
      store the auth config in a file and use it for further requests. Init that file with `karakeep
      auth init`.\r

      \  * If you're afraid to give agents full Read/Write access to your data, API keys now have
      granular scopes to all resources. Which means you can give agents access to your bookmarks but
      not administrative actions (like deleting users), etc.\r

      * **Keyboard Shortcuts**: You can now do more with the keyboard, as we added support for
      navigating the bookmark grid with keyboard shortcuts, and taking actions such as
      favouring/archiving and doing bulk actions. This is the beginning, and please send feature
      requests for the extra features you need.\r

      * **Extension improvements**:\r

      \  * [Experimental] The extension can now crawl bookmarks from the client-side eliminating the
      need of using the SingleFile extension separately from Karakeep (Powered by SingleFile core).
      This allows you to store pages that are behind authentication or unreachable from your
      Karakeep server. It's currently opt-in until stable, and then will become the default. Enable
      it from the extension settings (#2197).\r

      \  * Added support for manual save (instead of the default save on open) by @keslerm (#2693)\r

      * **More import sources**:\r

      \  * Add support for importing from OneTab by @apo-mak (#2495)\r

      \  * Add support for importing from Readwise Reader by @cinconueves (#2690)\r

      * **Others**:\r

      \  * Karakeep MCP now has an update-bookmark tool by @vbalko-claimate (#2717)\r

      \  * Add support for writing rule engine rules based on bookmark source by @xingzihai
      (#2547)\r

      \  * Add support for configuring OpenAI reasoning effort by @cinconueves (#2718)\r

      \  * New extensive event logging for events that happen all over the app. More info about how
      to enable it
      [here](https://docs.karakeep.app/configuration/environment-variables#monitoring).\r

      \r

      \r

      # UX Improvements ✨\r

      \r

      * Visual revamp for the bookmark preview page with nicer colors and ability to collapse the
      sidebar (f500129c).\r

      * Visual revamp for the \"All lists\" page showing list privacy settings and number of items
      in each list (145dda9d).\r

      * List and tags page headers now show more info about the content and type of the list/tag
      (#2749)\r

      * Quickly favourite and archive a bookmark by new buttons that appear on hover (98e173d8).\r

      * Haptic feedback on mobile sidebar navigation (f91ec531).\r

      * Show \"+\" in the tag count badges when more pages exist by @zerone0x (432235be).\r

      * In the add bookmark to list dialog, you no longer need to explicitly save the selection
      thanks to @xingzihai (#2629)\r

      * The default new list emoji changed from \"🚀\" to \"📁\". Maturity, I guess?\r

      * You can now add multiple lists to the same rule engine condition by @Ahmed-Abdel-karim
      (#2620)\r

      * Timestamps across the app are now correctly localized instead of showing the server's
      timezone (#2682)\r

      \r

      \r

      # Fixes 🐛\r

      \r

      * **Important Security fixes**:\r

      \  * Reported by @tahirsercan (GHSA-g647-327m-79g9)\r

      \    * Fix SSRF validation bypass caused by redirects in crawler and video worker\r

      \  * Those issues were reported by Sami Zayn:\r

      \    * Add missing ratelimits for the changePassword endpoint\r

      \    * Sanitize user names before storing them to avoid stored XSS in karakeep emails
      (#2724)\r

      \    * Invalidate existing password reset tokens before issuing a new one (#2722)\r

      \  * Reported by @CE2Sec (GHSA-7rx4-c5vx-g8w3)\r

      \    * Fix blind SSRF in crawler favicon extraction\r

      \  * Add missing ratelimits for bookmark creation and asset upload APIs\r

      * Fix a bug where adding a bookmark to a tag or list didn't appear immediately requiring a
      refresh.\r

      * Bulk actions used to hammer the server with cache refill requests, those are now
      debounced.\r

      * Fix adblocker getting skipped due to the URL validation interception.\r

      * Fix \"Manage tags\" page on iOS not scrolling correctly.\r

      * Prevent highlight popup from stealing focus on Firefox (11dfe74d)\r

      * Fix rare crash in the crawler worker (d197f595)\r

      * Increase max feed url length to 2k chars (07454a6a)\r

      * Fix cropped text in android app when using bold text by @Go2Engle (#2554)\r

      * Fix occasional problems connecting to server from mobile app when it's behind a reverse
      proxy by @mrInvincible29 (#2559)\r

      * Better extraction for lazy loaded images from content by @zerone0x (#2556)\r

      * Expand $tags/$aiTags/$userTags in AI prompt preview by @zerone0x (#2557)\r

      * Fix sourceUrl not getting saved when creating asset bookmarks via the API by @hoilc
      (#2574)\r

      * Redact internal server error messages in prod responses (c8a75a0b)\r

      * Correctly parse linkwarden collections during import (722fd8c0)\r

      * Correctly extract TWZ RSS categories as tags by @venku122 (#2589)\r

      * Correctly skip tagging and summarization for assets that fail preprocessing to avoid
      misleading numbers in the admin panel\r

      * Improve meilisearch request batching for better performance\r

      * Enable configuring monolith timeout and arguments by @NikhilChowdhury27 (#2659)\r

      * Fix openai proxy setting not getting respected by the openai client (#2676)\r

      * Fix formality and tone for a bunch of languages to match that of English\r

      * Use the same proxy URL for all network interactions within the same crawler job run\r

      * Fix parsing archived status for bookmarks imported from Pocket by @howwohmm (#2656)\r

      * Fix parsing archived status and folder for Instapaper bookmarks\r

      * Upgrade playwright to 1.59 to fix browserless compatibility issues\r

      * Stricter full text search matching strategy for bookmarks to provide more relevant results
      (68e73500)\r

      * Fix unreachable background script on Firefox by @Joly0 (#2649)\r

      * Update default meilisearch version to 1.41 by @ir31k0 (#2643).\r

      \  * If you want to update your instance, check out meilisearch's guide
      [here](https://www.meilisearch.com/docs/learn/update_and_migration/updating).\r

      * Fix truncate long bookmark titles on mobile app by @xuatz (#2699)\r

      * Dedupe crawl jobs using idempotency key by @NikhilChowdhury27 (#2678)\r

      * Add ability to finalize/delete a staged import session that might have been stuck before
      (#2713)\r

      * Fix low quality video downloads caused by missing ffmpeg dependency to yt-dlp by
      @MaximePinot (#2721)\r

      * Better ratelimiting for users behind the same IP (e.g. NAT) by including userId in the
      ratelimit key\r

      * Use relative path for logout redirect to avoid port mismatch by @howwohmm (#2655)\r

      * Skip URL type identification requests if a page is crawled with SingleFile by @GSAlex
      (#2580)\r

      * Fix text clipping in bookmark card notes by @beluga73 (#2748)\r

      * For CLI based server migrations, tags `attachedBy` is now correctly migrated (462d713f)\r

      \r

      \r

      # For Developers 🛠️\r

      \r

      * The API docs now have much more extensive documentation. (dd2c6cc0)\r

      * New APIs:\r

      \  * For Trigger admin background jobs (4974ce58)\r

      \  * For managing feed subscriptions by @larsborn (#2635)\r

      * Map TOO_MANY_REQUESTS to 429 status code in the API instead of internal server error
      (5b6402f3)\r

      * The docker-compose based dev-env is now more stable and documented thanks to @xuatz
      (#2149)\r

      \r

      # Community Projects 💡\r

      \r

      *Checkout our community projects page [here](https://docs.karakeep.app/community-projects).*\r

      \r

      * [Karatui](https://github.com/bercribe/karatui): A rust based TUI for managing your karakeep
      instance by @bercribe in 1c177160\r

      * [Karaclean](https://github.com/lmgarret/karaclean): A Docker sidecar that automatically
      cleans up Karakeep bookmarks based on declarative YAML rules (e.g. age, tags, lists, etc).
      @lmgarret\r

      \r

