    body: "## Version 0.12.5 – 06/23/2026\r

      \r

      ### Desktop\r

      \r

      #### Bug Fixes\r

      \r

      - Fix: stale WebSocket connection occasionally caused writes to disk to fail, which could lead
      to data loss in rare cases.\r

      \r

      ### Mobile\r

      \r

      #### Bug Fixes\r

      \r

      - Fix: stale WebSocket connection occasionally caused writes to disk to fail, which could lead
      to data loss in rare cases.\r

      \r

      ### Security Notice (Windows)\r

      \r

      This Windows release is signed with a newly renewed code-signing certificate. Because Windows
      SmartScreen builds reputation per certificate, you may temporarily see an \"unrecognized app\"
      warning. This build is properly signed and safe — if prompted, select **More info → Run
      anyway**. The warning will clear as the certificate establishes reputation."
