    body: "![splash](https://github.com/user-attachments/assets/dfc4823b-72a7-4abc-9858-d3d83c51577a)\r

      \r

      ## Release Summary\r

      \r

      Major user-facing changes include:\r

      \r

      **Video**\r

      \r

      * Added HDR support on Xbox One\r

      * Fixed Blu-ray playback on Linux\r

      * Fixed audio/subtitle issues when resuming Blu-rays\r

      * Fixed handling of HDR10 light metadata changes\r

      * Fixed subtitle selection for ISO 639-1 (two-letter) language codes\r

      \r

      **Library/Sources and Management**\r

      \r

      * Improved speed of video library rescans\r

      * Fixed multi-episode files overwriting the first episode\r

      * Fixed info dialog for certain Movie Versions\r

      * Fixed some false positives detecting Movie Versions\r

      \r

      **Music**\r

      \r

      * Fixed CDDB lookups using Gnudb.org's CDDB API\r

      * Fixed album search failing for artist names\r

      \r

      **Audio**\r

      \r

      * Fixed rare Pipewire crash when connecting/removing audio devices\r

      \r

      **PVR**\r

      \r

      * Fixed crash when a PVR stream is stopped via remote app\r

      \r

      **Peripherals**\r

      \r

      * Added support for Turkish keyboards on Linux\r

      * Fixed enabling and disabling [Pulse-Eight](https://www.pulse-eight.com) CEC adapters\r

      * Fixed the Delete and Alternative Insert keys on macOS\r

      * Fixed minor visual glitches when managing peripherals\r

      \r

      **Addons**\r

      \r

      * Fixed updating add-ons after 25 days of inactivity (extended to ~68 years)\r

      \r

      **Skin/GUI**\r

      \r

      * Fixed busy dialog crash when multiple dialogs are opened\r

      * Fixed suspend dialog remaining open after the system wakes up\r

      * Improved touch support for slider dialog arrows\r

      \r

      **Network**\r

      \r

      * Added support for HTTP Basic Authentication\r

      * Fixed some network streams failing due to interrupted HTTP/2 transfers\r

      * Updated libnfs to v6 for embedded platforms\r

      * Updated CA certificates to 2025-07-15 from the Mozilla CA certificate store\r\n"
