    body: "## About\r

      \r

      This release brings several fixes and improvements requested by the users.\r

      \r

      ## What's Changed\r

      - Added quick trim shortcuts in save video page for a more precise editing\r

      - Added a new \"lock orientation\" button in the recording page\r

      - Added a new experimental file picker with:\r

      \    - Filter support: past dates will show videos recorded on that date on the top\r

      \    - Preview support: videos can be fully watched before being selected\r

      - Added Czech localization\r

      - Added option to change profile in save video page\r

      - Added option to send logs when contacting developer\r

      - Improved video saving speed by processing only the selected part instead of the whole
      video\r

      - Improved save video page by separating options in tabs\r

      - Improved subtitles text field making it fully visible with longer texts by using a dialog\r

      - Fixed saving video error when locale has special characters\r

      - Fixed saving video error when color parsing fails\r

      - Fixed calendar page resetting to current date after returning from save video page for past
      dates\r

      - Fixed videoplayer showing some landscape videos rotated in preview\r

      - Fixed videos deletion not working if files were manually moved to app folder\r

      - Fixed movie creation that includes videos from before v1.5\r

      - Fixed movie deletion not updating the movie list correctly\r

      \r

      **Full Changelog**: https://github.com/KyleKun/one_second_diary/compare/v1.5.1...v1.5.2"
