    body: "**Added**\r

      \r

      - Adds Swap/Bridge feature to ARC mainnet.
      ([#31413)](https://github.com/MetaMask/metamask-mobile/pull/31413)\r

      \ \r

      **Fixed**\r

      \r

      - Fixed the MetaMask Card section on the Money screen so the \"Link card\" option and funding
      token placeholders are only shown when the card spending token is enabled in the card feature
      configuration. ([#31611](https://github.com/MetaMask/metamask-mobile/pull/31611))\r

      - Removed the trailing slash from the Arc explorer URL defined in
      `app/util/networks/customNetworks.tsx` so now the URL is correctly generated.
      ([#31718](https://github.com/MetaMask/metamask-mobile/pull/31718))\r

      - Fixed Arc native token support, included patches for MetaMask/core#9006 and
      MetaMask/core#9007 ([#31662](https://github.com/MetaMask/metamask-mobile/pull/31662))"
