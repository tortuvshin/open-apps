    body: "### Added\r

      \r

      - Add missing Component View Tests on Price Alerts (#32301)\r

      - Added interactive price charts to the Social Trading trader position view — buy/sell trade
      markers on the price line, (#32293)\r

      \  tap-to-focus between the chart and the trades list, and a day-grouped\r

      \  trades list with a sticky date header.\r

      - AdvancedChart now supports trade markers on the price line, focus-time/pulse animations, and
      a marker-tap event. (#32292)\r

      - Added \"$75K up for grabs\" Predict the Pitch campaign banner to the World Cup Hub screen,
      gated behind the (#32360)\r

      \  `predictWorldCup.showHubBanner` feature flag.\r

      - Added a redesigned World Cup hub with Games and Props tabs, knockout-stage section headers,
      and a \"Who will win the World (#32269)\r

      \  Cup?\" winner-prediction chip carousel.\r

      - Added MetaMask CLI notification preferences to Settings so users can control push and in-app
      alerts for CLI connection requests, (#31882)\r

      \  approvals, and session updates.\r

      - Add Arc network support (#31187)\r

      - Added a \"Forgot password?\" option to the card login screen that lets users reset their
      card password. (#32276)\r

      - Add proof of ownership to profile metrics (#32165)\r

      - Add Crypto Movers Quick Buy and search keyboard coordination (#32273)\r

      - Added Perps and Predict activity to the redesigned Activity list (#31772)\r

      - Added a migration to restore wiped token metadata for custom tokens on niche EVM chains that
      cannot auto-detect. (#32222)\r

      - Added the KONET mainnet icon for custom network display in MetaMask Mobile (#32235)\r

      - Added \"Add device to wallet\" flow (behind feature flag) allowing users to sync their
      MetaMask Mobile wallet with a MetaMask (#29229)\r

      \  browser extension via QR code\r

      - Add share button and share sheet to Token Details page (#31868)\r

      - Support editing price alerts (#32137)\r

      - Add Quick Trade button to each crypto token row on explore search (#31805)\r

      - Added animated compact headers to trader profile and position views in Social Leaderboard
      (#32122)\r

      - Added technical indicators (MACD, RSI, Bollinger Bands, Moving Averages, Volume) to the
      Token Details candlestick chart with (#31386)\r

      \  interval picker and MA selector, gated behind feature flag\r

      - Added check for price alerts supported networks (#32010)\r

      \r

      ### Changed\r

      \r

      - Revert \"feat(networking): integrate nitro-fetch with startup prefetching\" (#31206)\r

      - Improved QuickBuy and Weekly Top Traders interactions (#32392)\r

      - chore: migrate StackNavigationProp types to native-stack equivalents (#32119)\r

      - Updated the Follow / Following button and row spacing on the Top Traders leaderboard to
      match the latest design. (#32367)\r

      - Use built-ins for token details advanced charts and allow for better config options for
      other consumers. (#32322)\r

      - Improved Token Details advanced chart layout when RSI or MACD indicators are enabled, with
      more space reserved for the price (#32236)\r

      \  chart.\r

      - Prepare price alerts for prod (#32298)\r

      - Updates space between interval bar and chart (#32256)\r

      - Redesign price alerts UI (#32247)\r

      - Improved Token Details advanced chart interval switching to keep the chart visible while new
      data loads instead of (#32190)\r

      \  showing loading skeletons on every tap\r

      - Graduated the wallet home post-onboarding checklist so eligible new users always see the
      guided checklist on first (#31823)\r

      \  empty-balance wallet home visit.\r

      - Moved Batch Sell minimum received to being a subtext under Total received for better visual
      hierarchy. (#31744)\r

      - Replaced global.fetch with react-native-nitro-fetch (Cronet on Android, URLSession on iOS)
      and added startup prefetching for (#31206)\r

      \  feature flags and phishing lists\r

      - Gated the Card \"Forgot password\" option behind the cardForgotPasswordFeature remote
      feature flag. (#32341)\r

      - Improved Predict game details by grouping resolved markets in a Results dropdown. (#32181)\r

      - Changed the default Closed positions sort on a trader profile to sort by value, and added a
      Recent sort option to the Open (#32175)\r

      \  positions tab.\r

      - Whitelist asset universal links from interstitial modal (#32316)\r

      - Improve wallet-connect types (#31615)\r

      - Updated MetaMask Card legal and support links to use provider registration settings when
      available (#32248)\r

      - Updated asset details activity rows to use the redesigned activity list item when enabled
      (#31995)\r

      - Filter pooled-staking vault token and surface its balance as stakedBalance (#32126)\r

      - Improved Weekly Top Traders carousel so trader profiles open faster when tapped (#32125)\r

      - Improved batch sell transaction details and activity list display for EIP-7702 transactions
      (#31948)\r

      - Remove CTA button under notification (#32012)\r

      - Updated Money account copy and UI polish (Next Best Action APY copy, \"Money account
      benefits\" section, abbreviated activity (#32396)\r

      \  dates, \"Transaction fees\" labels, and a bolder \"Paid by MetaMask\"\r

      \  check).\r

      - Force-hide MAX button for Arc USDC swap/bridge (#32135)\r

      \r

      ### Fixed\r

      \r

      - Fixed moving average indicators rendering at incorrect positions on the token details chart
      after navigating back to the same (#32275)\r

      \  token.\r

      - Fixed an issue where a Predict bet paid with another token could be submitted with no
      available swap route, causing the (#32032)\r

      \  deposit to revert on-chain.\r

      - Fixed incorrect odds shown on Predict outcome cards for markets with a wide bid/ask spread.
      (#32197)\r

      - Fixed the Address List screen transition speed to match other wallet detail screens
      (#32207)\r

      - Fixed a bug that showed the delete option for Polygon network. (#32228)\r

      - Fixed missing spacing above Perps cards on the wallet homepage (#32211)\r

      - Fixed a bug that showed contacts saved on deleted networks as Ethereum (#32154)\r

      - Fixed token chart candle interval resetting when revisiting token details with technical
      indicators enabled (#32150)\r

      - Fixed display approved transactions for Non-EVM networks (#31838)\r

      - Fixed odds/prices being truncated on Predict bet buttons so the full price is always
      readable. (#31953)\r

      - Fixed the MetaMask Card section on the Money screen so the \"Link card\" option and funding
      token placeholders are only shown (#31611)\r

      \  when the card spending token is enabled in the card feature\r

      \  configuration.\r

      - Fixed confirmations to show \"Paid by MetaMask\" and a $0 fee for all sponsored Money
      Account transactions, including pre-quote (#32172)\r

      \  and withdrawals.\r

      - Fixed an intermittent error when tapping Withdraw on Perps that could prevent the withdrawal
      flow from starting (#32001)\r

      - Fixed VIP dashboard last-updated timestamp alignment and rewards settings section divider
      spacing. (#32271)\r

      - Fixed Rewards navigation errors when opening campaign outcome details, exiting VIP flows,
      and transitioning to the dashboard (#32265)\r

      \  after opt-in.\r

      - Fixed onboarding interest questionnaire grid layout for languages with longer option labels.
      (#32243)\r

      - Fixed contract interactions in the redesigned Activity list not showing the token amount
      (#32194)\r

      - Fixed the Add funds sheet to show \"Debit card\" instead of \"Debit card or Apple Pay\" on
      Android, where Apple Pay is not (#32208)\r

      \  available.\r

      - Fixed an issue where MetaMask would not fail over to another RPC URL when Infura is down
      (#31983)\r

      - Fixed Android soft keyboard obscuring text inputs in Rewards onboarding, claim rewards, and
      settings flows (#32186)\r

      - Fixed a crash when turning off Basic Functionality from Security & Privacy settings
      (#32189)\r

      - Fixed VIP splash screen layout on smaller devices (#32187)\r

      - Fixed an Android crash and frozen UI after dismissing the share sheet on the Rewards
      referral screen. (#32183)\r

      - Fixed a bug on Android where opening a dapp deep link while the app was in the background
      opened the dapp in two browser tabs. (#29475)\r

      - Fixed token details advanced chart dashed last-price line not matching ambient price color
      when price is negative. (#32164)\r

      - Fixed token details advanced chart to fall back to the legacy price chart when the
      TradingView library fails to load, instead (#32066)\r

      \  of showing a broken chart error state.\r

      - Fixed the Weekly Top Traders homepage carousel to show the same All-chain leaderboard as the
      full Top Traders view (#32127)\r

      - Fixed empty bottom spacing in Social Leaderboard and QuickBuy scroll views (#32124)\r

      - Fixed homepage Weekly Top Traders cards so tapping anywhere on the card opens the trader
      profile (#32123)\r

      - Price alerts should only work in USD (#32051)\r

      - fix: rebase before push in OTA release PR workflow to avoid push race (#31919)\r

      - Fixed trader avatars in Trading Signals notification preferences to show address-derived
      Maskicon fallback instead of a (#32046)\r

      \  monogram when no profile image is available.\r

      - Fixed Hyperliquid HIP-3 perp markets showing their provider prefix (e.g. `cash:`) in the
      social leaderboard, and disabled (#32008)\r

      \  the Trade button for assets without a supported xyz market.\r

      - fix: show correct decimal places when managing price alerts (#31986)"
