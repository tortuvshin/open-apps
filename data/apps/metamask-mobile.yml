    body: "### Added\r

      \r

      - Added Robinhood Chain as a featured network (#33114)\r

      - Added `Banner Dismissed` event (#32602)\r

      - Added Price Alerts notification preferences to Settings > Notifications (#32698)\r

      - Added Card refund balances and redemption from Card Home (#32485)\r

      - Added discount badges (VIP/Promo/DAO) to the bridge fee disclaimer based on the quote
      discountType (#32584)\r

      - Added the ability to select a phone country code on the deposit KYC Basic Info screen,
      allowing users to enter a phone number from a country different from their detected region
      (#31075)\r

      - Added Speed up and Cancel actions for pending transactions on the redesigned activity
      transaction details screen (#32618)\r

      - Added a QR code scanner button to the Send flow recipient field for scanning EVM recipient
      addresses (#32568)\r

      - Added thousand separators to MMPay amount inputs and prevented entering amounts above the
      maximum purchase limit for fiat payment methods (#32593)\r

      - Added a \"View activity\" CTA to the post-trade modal and refined the \"What to swap next\"
      section spacing/typography (#32588)\r

      - Added missing integration tests for price alerts (#32565)\r

      - Added a \"Purchases\" filter in the Money account activity list that groups card purchases,
      mUSD cashback, and refunds (#32516)\r

      - Added Ramp transactions to the redesigned Activity List and Activity Details experience
      (#32467)\r

      - Added an option to unlink a Money account from MetaMask Card (#32504)\r

      - Added sign prefix to price alert percentage displays (#32453)\r

      - Added redesigned activity details for Perps and Predict transactions (#32405)\r

      \r

      ### Changed\r

      \r

      - Gated the perps market list full asset name display (e.g. \"Bitcoin\" vs \"BTC\") behind a
      remote feature flag; ticker symbols are shown by default until the flag is enabled (#32878)\r

      - Disabled gas sponsorship for hw wallets (#32781)\r

      - Show push notifications when app is in foreground state (#32100)\r

      - Bumped bridge status controller to v74.0.2 (#32711)\r

      - Updated token card background and vertical padding, and size of the flip button (#32671)\r

      - Integrated the dynamic network registry into MetaMask Extension (#27201)\r

      - Account syncs via the QR Code, controller and integration with UI (#32078)\r

      - Gated addDeviceSyncEnabled behind minimum version (#32630)\r

      - Migrated perps charts to Advanced Charts (#31247)\r

      - Snaps now periodically check for over-the-air updates and report improved update metrics
      (#32459)\r

      - Requests from an external browser deeplink, scanned QR code, or a MetaMask SDK / MetaMask
      Connect / WalletConnect session now show \"External app\" as the request origin instead of an
      opaque `deeplink` / `qr-code` / connection id, or an unverifiable self-reported domain
      (#30547)\r

      - Integrated AUS Perps Watchlist (#31734)\r

      - Enriched NFT transactions in the redesigned Activity view with the collection name, the
      amount paid or received, and the NFT artwork (#32441)\r

      - Allowed commas for decimals in the update spending limit screen (#32403)\r

      - Enabled smart transaction support for hardware wallet accounts (#31689)\r

      - Improved the load time of the money home and activity list (#32800)\r

      - Updated the Perps Markets sort bottom sheet to use the design system and apply sort
      selection immediately when an option is chosen (#32689)\r

      - Improved section spacing and dividers on Explore tabs and Perps Home for more consistent
      layout (#32561)\r

      - Improved the Bridge quote flip button animation with a subtle bounce (#32715)\r

      - Improved Social Trading position charts to frame the trader's trades, with tap-to-focus on
      individual trades (#32590)\r

      - Updated the Top Traders Follow button to match the size and padding of the leaderboard
      filter pills (#32676)\r

      - Updated the Perps order book price grouping selector to use the design system bottom sheet
      with improved close animation (#32625)\r

      - Updated Perps home Products pills and Markets category filters to use consistent MMDS
      category icons and Top Movers-style pill layout (#32616)\r

      - Updated the SDK v1 connection screen to use the current MetaMask fox branding (#31829)\r

      - Updated the Swaps token input design and added verified token badges for eligible tokens
      (#32422)\r

      - Updated the Perps order book unit toggle and price grouping controls to use the design
      system components (#32451)\r

      - Improved the compact header on trader perps positions to show leverage, direction, and a
      clearer two-row layout separating trader context from token price data (#32574)\r

      - Improved responsiveness when opening the weekly top traders leaderboard (#32474)\r

      - Updated the Money account FAQ copy and added a Risk and Disclosures section (#32267)\r

      - Updated the candle chart tooltip to show OHLC data inline with the token price header,
      removing the layout shift that previously occurred on press-hold (#32512)\r

      - Updated Perps market lists to display the full asset name (e.g. \"Bitcoin\") instead of the
      ticker symbol (e.g. \"BTC\") (#32510)\r

      - Updated the add-device flow waiting screen to show a loading state while waiting for the
      extension, and added an error sheet when the extension import is cancelled or fails (#32511)\r

      - Improved error handling of price alerts (#32469)\r

      - Updated the Rive onboarding animation to latest and refactors `MoneyOnboardingView` to
      render text overlay on top of Rive animation (#32438)\r

      - Updated the Perps market details and order book headers to show token info in a unified
      design-system header (#32426)\r

      - Updated Perps markets list category filters and sort control to use the MetaMask design
      system filter and select components (#31125)\r

      \r

      ### Removed\r

      \r

      - Removed assets deprecated code (#30803)\r

      - Removed unused earnMoneyDepositNoFeeTokens and MoneyHomeScreenEnabled flags (#32489)\r

      \r

      ### Fixed\r

      \r

      - Fixed bridge transaction details freezing after tapping \"View on block explorer\" when
      selecting a source or destination chain explorer (#33116)\r

      - Fixed smart account nav header (#33089)\r

      - Fixed a bug where \"Earn on your crypto\" and Card \"avail. balance\" on the Money Home
      screen rendered in the user's preferred fiat currency instead of USD. (#33047)\r

      - Fixed the Money Account amount used by Card (#33030)\r

      - Fixed a crash on app launch that could occur when transaction controller state was not yet
      initialized (#32882)\r

      - Fixed the \"Swap again\" button not appearing on Solana and other non-EVM swap activity
      details (#32831)\r

      - Fixed pills in explore search taking too much space (#32817)\r

      - Fix show price alert button for non-EVM tokens and fix USD conversion (#32827)\r

      - Fixed \"Learn more\" modal leaving users stuck after redirecting to in-app browser without
      dismissing the bottom sheet (#32779)\r

      - Fixed alignment of view all button in explore (#32724)\r

      - Fixed approval or interaction transactions could show undefined undefined in the Activity
      list (#31556)\r

      - Fixed the send flow not respecting the \"Show conversion on test networks\" setting —
      testnet assets (e.g. SepoliaETH) no longer display fiat values or sort by them unless the
      setting is enabled (#32687)\r

      - Fixed native token asset details header incorrectly showing a zero contract address and copy
      button (#32695)\r

      - Fixed an error that blocked selecting a Predict or Perps withdraw token you don't already
      hold (#32703)\r

      - Fixed dollar amounts in Money Account home, activity list, and activity details sometimes
      showing the user's preferred currency symbol instead of US dollars (#32664)\r

      - Fixed an incorrect \"Linking your card\" label that appeared when updating the spending
      limit of an already-linked MetaMask Card (#32705)\r

      - Fixed swap transaction details showing a blank screen for some swaps, simplified the account
      rows so swaps show a single Account row instead of duplicate From/To, and fixed \"Swap again\"
      opening the swap view with empty tokens (#32678)\r

      - Fixed size of icons in money activity details screens (#32712)\r

      - Fixed rendering of apple order IDs in money account (#32591)\r

      - Fixed safe area layout on the Perps markets list screen so content scrolls correctly above
      the home indicator (#32563)\r

      - Fixed hardware bottom sheet not appearing during ledger connection (#32619)\r

      - Fixed stale traders appearing in Trading Signals notification preferences after unfollowing
      a trader (#32646)\r

      - Fixed a bug that could let users in unsupported Buy regions enter the crypto purchase flow
      instead of seeing the unavailable region message (#31527)\r

      - Fixed the Perps Order Details screen so HIP-3/xyz market orders display the user facing
      asset ticker (#32621)\r

      - Fixed token details time range selector staying in a loading state after switching chart
      time ranges (#32592)\r

      - Fixed the toast shown when withdrawing from Perps or Predictions into the Money account so
      it confirms funds were added to the Money account instead of a generic wallet message
      (#32156)\r

      - Fixed a bug where selecting a token from the post-trade \"What to swap next\" section could
      set identical source and destination tokens, causing a no-quote error (#32523)\r

      - Fixed an issue where funding the money account from the wallet home screen returned the user
      to the home screen instead of their Money Account home (#32528)\r

      - Fixed an issue where the marketing data collection toggle would not stay on for social login
      user (#32458)\r

      - Fixed Unified Buy deep links with an amount parameter to prefill the specified amount
      (#31525)\r

      - Corrected Predict activity trade amounts (#32351)\r

      - Fixed a bug where the World Cup Games tab showed a green live indicator even when no matches
      were in progress (#32542)\r

      - Fixed the Money account benefits link so it opens in the in-app browser instead of an
      external browser (#32530)\r

      - Fixed campaign details pages showing leaderboard or stats from a different campaign when
      switching between campaigns (#32374)\r

      - Fixed a stale bottom-sheet overlay that blocked navigation after proceeding from a bridge
