    body: >-
      ## English


      - Upgraded publishing to Super Agent chat.

      - Record thoughts, images, files, and context in one conversation.

      - Memex can organize chats into timelines, knowledge, and tasks.

      - Tasks keep processing after closing chat and can resume later.

      - Added support for 13 languages.

      - Improved sharing, file import, clipboard images, backup, AI settings, health data, timeline,
      and knowledge base stability.


      ## 简体中文


      - 发表入口升级为 Super Agent 聊天模式。

      - 支持用对话记录想法、图片、文件和上下文。

      - Memex 可将聊天整理为时间线、知识和任务。

      - 关闭聊天后任务仍可继续处理，重新打开可接回进度。

      - 新增 13 种语言支持。

      - 优化分享、文件导入、剪贴板图片、备份、AI 设置、健康数据、时间线和知识库稳定性。
