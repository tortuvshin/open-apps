    body: >-
      ## English


      What’s new:

      1. Upgraded the Memex Agent runtime for faster task execution and lower token usage.

      2. Improved long-running tasks, retry recovery, and background processing reliability.

      3. Enhanced image attachment handling and sub-agent collaboration for more accurate records,
      knowledge organization, and card updates.

      4. Added download/share support for Knowledge Markdown files.

      5. Polished the chat panel, activity indicators, and background notifications, with several
      experience fixes.


      ## 简体中文


      本次更新：

      1. 升级 Memex Agent 运行链路，任务处理更快，模型 Token 消耗更少。

      2. 改进长任务、重试恢复和后台处理机制，Agent 在后台运行更可靠。

      3. 优化图片附件理解与子 Agent 协作，记录生成、知识整理和卡片更新更准确。

      4. 知识库 Markdown 文件新增下载/分享入口，便于导出和备份。

      5. 优化聊天面板、处理状态提示和后台通知，并修复若干体验问题。
