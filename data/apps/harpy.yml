    body: "For the time being harpy is still working by using Twitter's legacy v1 api.\r

      \r

      This release updated the user profile to use the old v1 api instead of the non-free v2 api to
      make profiles work again.\r

      \r

      Please note that this doesn't mean that harpy will be maintained again, seeing as Twitter will
      most likely shut down access to their legacy api (again) soon and third party apps are still
      against their TOS."
