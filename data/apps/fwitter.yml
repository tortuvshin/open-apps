    body: "##  06 Feb 2022\r

      \r

      - Open tweet detail when clicked on push notification if user tag available\r

      - Display in-app notification on user follow\r

      - Added pinch to zoom on profile and Tweet.\r

      - Retweet post without adding adding comment.\r

      - User can update profile banner.\r

      - Share tweet link to other social media apps.\r

      - Share user profile link to other social media apps.\r

      - Enable copy tweet link to clipboard.\r

      - Share tweet link on other social media apps.\r

      - Capture tweet as image and share on other social media apps with tweet link and
      description.\r

      - Added user profile qr code generator and scanner.\r

      - New comment will be displayed on top.\r

      - Added link preview in tweet.\r

      - Bug fixed and performance improvements.\r

      - Display suggested users list to follow\r

      - Follow/Un-follow user from follower/following users list\r

      \r

      ## Download App\r

      \  [Click
      here](https://play.google.com/store/apps/details?id=com.thealphamerc.flutter_twitter_clone) to
      install app.\r\n"
