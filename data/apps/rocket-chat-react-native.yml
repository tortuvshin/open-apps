    body: "## What's Changed\r

      * fix: load 50 messages with hideSystemMessages as true on old workspaces by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7305\r

      * fix: Deeplink auth when host is already connected by @yash-rajpal in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7358\r

      * fix: re-subscribe rooms stream after forced socket reopen by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7362\r

      * fix: keep live socket on deeplink login (prevent orphan WebSocket clobber) by @diegolmello
      in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7380\r

      * perf(markdown): reduce room-open render cost with parse cache and compiler memoization by
      @diegolmello in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7348\r

      * perf(call): cut HeaderCallButton mount cost by consolidating call hooks by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7361\r

      * chore: upgrade @react-native-picker/picker to 2.11.4 by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7357\r

      * chore: migrate DirectoryView to Hooks by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7359\r

      * chore: remove wt-specific worktree contract from CLAUDE.md by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7365\r

      * docs: Update README.md by @aytaj-ismayilzada in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7356\r

      \r

      ## New Contributors\r

      * @aytaj-ismayilzada made their first contribution in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7356\r

      \r

      **Full Changelog**:
      https://github.com/RocketChat/Rocket.Chat.ReactNative/compare/4.73.0...4.73.1\r\n"
