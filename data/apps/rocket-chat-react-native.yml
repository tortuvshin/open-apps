    body: "## What's Changed\r

      * feat(a11y): alt text by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7163\r

      * feat(a11y): Message actions announcement and back focus by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7229\r

      * fix: render Attachment file name in Thread Message preview when body is empty by
      @diegolmello in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7323\r

      * fix: preference value changes causing reset to other option by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7313\r

      * fix: do not encrypt messages when workspace E2E is disabled by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7324\r

      * fix: emoji picker scroll does not reach the end by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7312\r

      * fix: ActionSheet cuts off the bottom content by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7326\r

      * fix(android): set RC Mobile User-Agent on push notification avatar fetch by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7339\r

      * fix: don't cancel login saga on 2s timeout (stranded login screen) by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7340\r

      * fix: prevent crash on Android devices without telecom feature by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7334\r

      * fix: Drain lost hangups on WebSocket reconnect by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7345\r

      * fix: SAML login fails due to double login race by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7343\r

      * fix(a11y): replace composer auto-focus with header focus in RoomView by @OtavioStasiak in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7336\r

      * fix(android/voip): start microphone FGS for outgoing calls so audio survives backgrounding
      by @diegolmello in https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7346\r

      * fix(ci): restore iOS upload on develop after upload-hold removal by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7352\r

      * chore: Bump version to 4.73.0 by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7318\r

      * chore: migrate package manager from yarn to pnpm by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7303\r

      * chore: upgrade to react-native-mmkv v4 by @Rohit3523 in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/6991\r

      * chore: begin Experimental app sunset by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7320\r

      * chore: stop publishing Experimental app by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7321\r

      * chore: delete Experimental code paths and assets by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7322\r

      * chore(ci): point build workflows at renamed GitHub environments by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7335\r

      * chore(ci): drop iOS upload-hold gate from PR build flow by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7344\r

      * chore: align local defaults with chat.rocket.android / chat.rocket.ios by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7347\r

      * refactor(native): flatten \"official\" naming across Android, iOS, CI by @diegolmello in
      https://github.com/RocketChat/Rocket.Chat.ReactNative/pull/7325\r

      \r

      **Full Changelog**:
      https://github.com/RocketChat/Rocket.Chat.ReactNative/compare/4.72.0...4.73.0"
