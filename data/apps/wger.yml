    body: "<!-- Release notes generated using configuration in .github/release.yml at 1.11.0 -->\r

      \r

      ## What's Changed\r

      ### Features\r

      * Add vegan and vegetarian fields and filters to the ingredient by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1124\r

      * Add minimum server version check during login by @darshAnup24 in
      https://github.com/wger-project/flutter/pull/1146\r

      * fix: replace EOL sqlite3_flutter_libs with drift_flutter by @JohnWeidner in
      https://github.com/wger-project/flutter/pull/1155\r

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1135\r

      * Prevent Redundant Loading in `NutritionalPlanScreen` by @NiazSagor in
      https://github.com/wger-project/flutter/pull/1139\r

      * Group slots in the UI with the same exercise by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1158\r

      * chore(Flatpak): add HealthFitness and related categories by @radmorecameron in
      https://github.com/wger-project/flutter/pull/1166\r

      * chore(flatpak): update metainfo to indicate mobile support by @radmorecameron in
      https://github.com/wger-project/flutter/pull/1165\r

      * fix: use unit IDs directly in Log.fromSetConfigData to prevent null on save by @efrahim20319
      in https://github.com/wger-project/flutter/pull/1175\r

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1159\r

      * version 2.5 by @rolandgeider in https://github.com/wger-project/flutter/pull/1169\r

      * Move exercise description to markdown by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1109\r

      * Add \"warmup\" to list of slot entry types by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1132\r

      * feat(measurements): remove date restriction to allow multiple entries per day by @sg172003
      in https://github.com/wger-project/flutter/pull/1150\r

      * Expose units in the nutritional plan by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1167\r

      * Move the variation to a field in the exercise by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1174\r

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1177\r

      ### Dependencies\r

      * Bump fl_chart from 1.1.1 to 1.2.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1148\r

      * Bump cupertino_icons from 1.0.8 to 1.0.9 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1162\r

      * Bump mockito from 5.6.3 to 5.6.4 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1160\r

      * Bump addressable from 2.8.7 to 2.9.0 in /ios by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1164\r

      * Bump shared_preferences from 2.5.4 to 2.5.5 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1161\r

      * Bump package_info_plus from 9.0.1 to 10.0.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1172\r

      * Bump softprops/action-gh-release from 2 to 3 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1171\r

      \r

      ## New Contributors\r

      * @darshAnup24 made their first contribution in
      https://github.com/wger-project/flutter/pull/1146\r

      * @JohnWeidner made their first contribution in
      https://github.com/wger-project/flutter/pull/1155\r

      * @NiazSagor made their first contribution in
      https://github.com/wger-project/flutter/pull/1139\r

      * @radmorecameron made their first contribution in
      https://github.com/wger-project/flutter/pull/1166\r

      * @efrahim20319 made their first contribution in
      https://github.com/wger-project/flutter/pull/1175\r

      * @sg172003 made their first contribution in
      https://github.com/wger-project/flutter/pull/1150\r

      \r

      **Full Changelog**: https://github.com/wger-project/flutter/compare/1.10.2...1.11.0"
