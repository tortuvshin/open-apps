    body: >-
      <!-- Release notes generated using configuration in .github/release.yml at 2.0.0 -->


      ## What's Changed

      ### Features

      * feat(nutrition): filter ingredient search by Nutri-Score by @kiranannadatha8 in
      https://github.com/wger-project/flutter/pull/1179

      * fix(routine): resolve in-place state mutation in GymStateNotifier and enable Routine
      immutability by @pankaj-basnet in https://github.com/wger-project/flutter/pull/1187

      * Add sanity check for server configuration by @rolandgeider in
      https://github.com/wger-project/flutter/pull/1188

      * feat(android): implement Android 13 per-app language support (#550) by @aria-tec in
      https://github.com/wger-project/flutter/pull/1186

      * Implement server-side language validation on exercise description steps by @umaidshahid in
      https://github.com/wger-project/flutter/pull/1189

      * feat(settings): add in-app language switcher (#439) by @PawelHaracz in
      https://github.com/wger-project/flutter/pull/1195

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1178

      * fix(nutrition): resolve fl_chart app crash when toggling meal details in Nutritional Plan
      Detail screen by @pankaj-basnet in https://github.com/wger-project/flutter/pull/1202

      * WIP - feat(nutrition): implement ingredients management and custom lists by @pankaj-basnet
      in https://github.com/wger-project/flutter/pull/1194

      * Feature(#630): Show brand for ingredients by @anjakDev in
      https://github.com/wger-project/flutter/pull/1203

      * Translations update from Hosted Weblate by @weblate in
      https://github.com/wger-project/flutter/pull/1204

      * Improve accessibility labels for workout controls by @eltahirsami in
      https://github.com/wger-project/flutter/pull/1211

      * Offline mode by @rolandgeider in https://github.com/wger-project/flutter/pull/1183

      ### Dependencies

      * Bump build_runner from 2.14.0 to 2.14.1 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1184

      * Bump build_runner from 2.14.1 to 2.15.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1191

      * Bump image_picker from 1.2.1 to 1.2.2 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1190

      * Bump flutter_svg from 2.2.4 to 2.3.0 by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1192

      * Bump jwt from 2.9.3 to 2.10.3 in /ios by @dependabot[bot] in
      https://github.com/wger-project/flutter/pull/1210


      ## New Contributors

      * @kiranannadatha8 made their first contribution in
      https://github.com/wger-project/flutter/pull/1179

