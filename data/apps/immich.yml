    body: "# v3.0.2\r

      \r

      This patch release addresses various bugs from v3 release and adds an additional filter to
      workflows\r

      \r

      <!-- Release notes generated using configuration in .github/release.yml at v3.0.2 -->\r

      \r

      ## What's Changed\r

      ### 🌟 Enhancements\r

      * fix(web): add ARIA label to ServerStatisticsCard by @tjhorner in
      https://github.com/immich-app/immich/pull/29497\r

      * feat(server): hls variant configuration by @mertalev in
      https://github.com/immich-app/immich/pull/29613\r

      * feat: user agnostic database restore by @danieldietzler in
      https://github.com/immich-app/immich/pull/29512\r

      * feat(server): date workflow filter by @benbeckford in
      https://github.com/immich-app/immich/pull/29040\r

      ### 🐛 Bug fixes\r

      * fix: re-add gCastEnabled negation by @bo0tzz in
      https://github.com/immich-app/immich/pull/29499\r

      * fix: downmix audio to stereo to fix broken channel layout by @lukasdotcom in
      https://github.com/immich-app/immich/pull/29485\r

      * fix: live transcoding when viewing from a link share by @lukasdotcom in
      https://github.com/immich-app/immich/pull/29471\r

      * fix: web search timeline visibility by @danieldietzler in
      https://github.com/immich-app/immich/pull/29518\r

      * fix(web): missing i18n strings by @wonsukchoi in
      https://github.com/immich-app/immich/pull/29612\r

      * fix: chinese browser locales recognition by @danieldietzler in
      https://github.com/immich-app/immich/pull/29622\r

      * chore: improve added to album messages by @danieldietzler in
      https://github.com/immich-app/immich/pull/29641\r

      * fix(mobile): fix 10-bit heic and avif colors on android by @santoshakil in
      https://github.com/immich-app/immich/pull/29631\r

      * fix(mobile): match iOS scroll to top and tabbar scroll (#28469) by @agg23 in
      https://github.com/immich-app/immich/pull/29705\r

      * fix: wrap migrations in transaction by @shenlong-tanwen in
      https://github.com/immich-app/immich/pull/29664\r

      * fix: oauth account linking by @danieldietzler in
      https://github.com/immich-app/immich/pull/29624\r

      * fix: incorrect grouping of recently added assets by @benbeckford in
      https://github.com/immich-app/immich/pull/29666\r

      * fix: integrity checks checksum pagination by @danieldietzler in
      https://github.com/immich-app/immich/pull/29516\r

      * fix(mobile): missing crop options and rotation scaling by @bwees in
      https://github.com/immich-app/immich/pull/29645\r

      * fix(mobile): properly handle live photos locally by @agg23 in
      https://github.com/immich-app/immich/pull/29462\r

      * fix: integrity checks dto validation by @danieldietzler in
      https://github.com/immich-app/immich/pull/29621\r

      * fix(mobile): http request handling after isolate death by @mertalev in
      https://github.com/immich-app/immich/pull/29714\r

      * fix: do not log out on automatic url switch by @shenlong-tanwen in
      https://github.com/immich-app/immich/pull/29715\r

      * fix(server): stream ffprobe packets by @mertalev in
      https://github.com/immich-app/immich/pull/29723\r

      * fix: search metadata for album shared links by @danieldietzler in
      https://github.com/immich-app/immich/pull/29742\r

      * fix(web): clear asset selection when search context changes by @khanguyen74 in
      https://github.com/immich-app/immich/pull/29738\r

      * fix(mobile): update timeline args on layout constraint changes by @santoshakil in
      https://github.com/immich-app/immich/pull/29653\r

      * fix: iso date parsing for three digit years by @danieldietzler in
      https://github.com/immich-app/immich/pull/29739\r

      * fix: missing files integrity checks by @danieldietzler in
      https://github.com/immich-app/immich/pull/29737\r

      * fix(mobile): play videos from search results and folder view by @santoshakil in
      https://github.com/immich-app/immich/pull/29693\r

      * fix(web): recursively unnest class arrays by @meesfrensel in
      https://github.com/immich-app/immich/pull/29755\r

      * fix: emit album update event when uploading assets through shared link by @danieldietzler in
      https://github.com/immich-app/immich/pull/29757\r

      * fix(web): always initialize language manager to set lang and dir by @meesfrensel in
      https://github.com/immich-app/immich/pull/29696\r

      ### 📚 Documentation\r

      * chore: update docs with v3 tags by @alextran1502 in
      https://github.com/immich-app/immich/pull/29312\r

      * fix(docs): use correct heading name for DB dump by @track0x1 in
      https://github.com/immich-app/immich/pull/29483\r

      * feat(docs): add Malayalam language support in README files by @jinskjoy in
      https://github.com/immich-app/immich/pull/29593\r

      * fix(docs): clarify version policy by @mmomjian in
      https://github.com/immich-app/immich/pull/29654\r

      ### 🌐 Translations\r

      * chore(web): update translations by @weblate in
      https://github.com/immich-app/immich/pull/29415\r

      \r

      ## New Contributors\r

      * @tjhorner made their first contribution in https://github.com/immich-app/immich/pull/29497\r

      * @wonsukchoi made their first contribution in
      https://github.com/immich-app/immich/pull/29612\r

      * @track0x1 made their first contribution in https://github.com/immich-app/immich/pull/29483\r

      * @jinskjoy made their first contribution in https://github.com/immich-app/immich/pull/29593\r

      * @khanguyen74 made their first contribution in
      https://github.com/immich-app/immich/pull/29738\r

      \r

      **Full Changelog**: https://github.com/immich-app/immich/compare/v3.0.1...v3.0.2"
