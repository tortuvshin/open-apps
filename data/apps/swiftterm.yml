    body: "## What's Changed\r

      * Fix MacCaretView transparency support by @Rostmen in
      https://github.com/migueldeicaza/SwiftTerm/pull/497\r

      * Fix: Kitty keyboard protocol sequences incorrectly trigger cursor save/restore by
      @mauricehofman in https://github.com/migueldeicaza/SwiftTerm/pull/500\r

      * Fix Home/End keys not sending escape sequences on macOS by @colemaco in
      https://github.com/migueldeicaza/SwiftTerm/pull/502\r

      * Force terminal redraw to reflect new font and reflowed content by @chinsyo in
      https://github.com/migueldeicaza/SwiftTerm/pull/499\r

      * Disable opportunistic Subprocess imports in LocalProcess by @zxss702 in
      https://github.com/migueldeicaza/SwiftTerm/pull/505\r

      \r

      ## New Contributors\r

      * @Rostmen made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/497\r

      * @mauricehofman made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/500\r

      * @chinsyo made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/499\r

      \r

      **Full Changelog**: https://github.com/migueldeicaza/SwiftTerm/compare/v1.12.0...v1.13.0"
