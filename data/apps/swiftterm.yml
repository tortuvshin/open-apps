    body: "## What's Changed\r

      ### Features and improvements\r

      \r

      - Added VoiceOver support and accessible attributed text for SwiftTerm on iOS.
      ([#509](https://github.com/migueldeicaza/SwiftTerm/pull/509) by @holzschu;
      [#521](https://github.com/migueldeicaza/SwiftTerm/pull/521) by @migueldeicaza)\r

      - Added `regionalIndicatorWidth` to configure the display width of regional-indicator symbols.
      ([#516](https://github.com/migueldeicaza/SwiftTerm/pull/516) by @gi11es)\r

      - Added configurable font smoothing, terminal-cell-based PTY pixel-size reporting, and a Metal
      renderer scale override. ([#531](https://github.com/migueldeicaza/SwiftTerm/pull/531) by
      @jimprosser; [#544](https://github.com/migueldeicaza/SwiftTerm/pull/544) and
      [#545](https://github.com/migueldeicaza/SwiftTerm/pull/545) by @evertjr)\r

      - Added Shift+mouse support to temporarily bypass application mouse reporting.
      ([#536](https://github.com/migueldeicaza/SwiftTerm/pull/536) by @evertjr)\r

      - Opened macOS mouse-event overrides and `TerminalView.deleteBackward` for subclass
      customization. ([#535](https://github.com/migueldeicaza/SwiftTerm/pull/535) by @padresb;
      [#562](https://github.com/migueldeicaza/SwiftTerm/pull/562) by @JBetchGH)\r

      - Added public iOS selection APIs, including `hasActiveSelection`, `setSelectionRange`,
      `clearSelection`, and a standard context-menu wrapper.
      ([#549](https://github.com/migueldeicaza/SwiftTerm/pull/549),
      [#550](https://github.com/migueldeicaza/SwiftTerm/pull/550), and
      [#554](https://github.com/migueldeicaza/SwiftTerm/pull/554) by @JBetchGH)\r

      - Added public `searchMatchSummary` and `totalLinesTrimmed` APIs.
      ([#572](https://github.com/migueldeicaza/SwiftTerm/pull/572) by @AlexDemzz;
      [#569](https://github.com/migueldeicaza/SwiftTerm/pull/569) by @JBetchGH)\r

      - Improved responsiveness and scalability by rendering local input responses immediately,
      adding PTY read backpressure, and making buffer resizing scale with actual content.
      ([#553](https://github.com/migueldeicaza/SwiftTerm/pull/553) by @evertjr;
      [#574](https://github.com/migueldeicaza/SwiftTerm/pull/574) and
      [#573](https://github.com/migueldeicaza/SwiftTerm/pull/573) by @dxmone)\r

      - Reduced the synchronized-output debounce to 16 ms and exposed it publicly.
      ([#526](https://github.com/migueldeicaza/SwiftTerm/pull/526) by @gi11es)\r

      - Added support for preventing the view from automatically scrolling to the bottom.
      ([#587](https://github.com/migueldeicaza/SwiftTerm/pull/587) by @migueldeicaza)\r

      \r

      ### Fixes\r

      \r

      - Avoid setting the terminal size when the requested dimensions are `0×0`.
      ([#508](https://github.com/migueldeicaza/SwiftTerm/pull/508) by @holzschu)\r

      - Fixed Kitty keyboard handling for modifier flags and Option-composed characters.
      ([#514](https://github.com/migueldeicaza/SwiftTerm/pull/514) by @gi11es;
      [#564](https://github.com/migueldeicaza/SwiftTerm/pull/564) by @evertjr)\r

      - Corrected SGR mouse-motion encoding, mouse-tracking reset behavior, and iOS tap reporting.
      ([#520](https://github.com/migueldeicaza/SwiftTerm/pull/520) by @evertjr;
      [#571](https://github.com/migueldeicaza/SwiftTerm/pull/571) by @AlexDemzz;
      [#586](https://github.com/migueldeicaza/SwiftTerm/pull/586) by @mathewtaylor)\r

      - Corrected scrolling and buffer behavior, including default `canScroll`, alternate-screen
      margins, and wrapped-line state. ([#507](https://github.com/migueldeicaza/SwiftTerm/pull/507)
      and [#523](https://github.com/migueldeicaza/SwiftTerm/pull/523) by @holzschu;
      [#522](https://github.com/migueldeicaza/SwiftTerm/pull/522) by @colemaco)\r

      - Fixed macOS dictation support and removed duplicate iOS accessibility methods.
      ([#501](https://github.com/migueldeicaza/SwiftTerm/pull/501) by @SilverMarcs;
      [#527](https://github.com/migueldeicaza/SwiftTerm/pull/527) by @gi11es)\r

      - Fixed synchronized-output rendering and a deterministic synchronized-output test failure.
      ([#498](https://github.com/migueldeicaza/SwiftTerm/pull/498) by @inbarajaldrin;
      [#581](https://github.com/migueldeicaza/SwiftTerm/pull/581) by @bones7456)\r

      - Corrected light-theme grayscale palettes, text-presentation symbol rendering on iOS, and
      full-width CJK glyph alignment. ([#529](https://github.com/migueldeicaza/SwiftTerm/pull/529)
      and [#578](https://github.com/migueldeicaza/SwiftTerm/pull/578) by @evertjr;
      [#575](https://github.com/migueldeicaza/SwiftTerm/pull/575) by @AlexDemzz)\r

      - Fixed Metal and Core Graphics rendering issues, including stale cursors, window reparenting,
      color space, margins, and restricted-region scroll artifacts.
      ([#546](https://github.com/migueldeicaza/SwiftTerm/pull/546),
      [#547](https://github.com/migueldeicaza/SwiftTerm/pull/547),
      [#548](https://github.com/migueldeicaza/SwiftTerm/pull/548), and
      [#541](https://github.com/migueldeicaza/SwiftTerm/pull/541) by @evertjr;
      [#582](https://github.com/migueldeicaza/SwiftTerm/pull/582) by @tavvet)\r

      - Fixed iOS scrollback corruption, macOS hidden-scroller layout, and backwards word-selection
      behavior. ([#567](https://github.com/migueldeicaza/SwiftTerm/pull/567) by @ferponse;
      [#543](https://github.com/migueldeicaza/SwiftTerm/pull/543) by @evertjr;
      [#576](https://github.com/migueldeicaza/SwiftTerm/pull/576) by @bones7456)\r

      - Eliminated retain cycles that could leak `Terminal` and `LocalProcess` instances.
      ([#538](https://github.com/migueldeicaza/SwiftTerm/pull/538) and
      [#551](https://github.com/migueldeicaza/SwiftTerm/pull/551) by @evertjr)\r

      \r

      ## New Contributors\r

      \r

      * @gi11es made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/514\r

      * @SilverMarcs made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/501\r

      * @inbarajaldrin made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/498\r

      * @jimprosser made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/531\r

      * @padresb made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/535\r

      * @JBetchGH made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/549\r

      * @ferponse made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/567\r

      * @dxmone made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/574\r

      * @AlexDemzz made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/572\r

      * @bones7456 made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/576\r

      * @tavvet made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/582\r

      * @mathewtaylor made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/586\r

      \r

      **Full Changelog**: https://github.com/migueldeicaza/SwiftTerm/compare/v1.13.0...v1.14.0"
