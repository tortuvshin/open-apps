    body: "Thanks to all the Hacktoberfest participants, translators, and other volunteers for helping
      out!\r

      \r

      ### Added\r

      * Turkish translation\r

      * Null safety\r

      * Tooltips for better accessibility\r

      * On-hover timer resume buttons\r

      * Directly visible timer stop button\r

      * Project action menu for discoverability\r

      * Filter indicator\r

      * Press enter to start timer\r

      * Support for Android 13 per-app localization\r

      * Monochrome launcher icon\r

      \r

      ### Changed\r

      * Translations\r

      * Updated dependencies\r

      * Refactored, fixed up a lot of code\r

      * Increased Android compile SDK\r

      * Clearer import/export labels\r

      * Settings Icon\r

      * Numerals font\r

      * Replaced gesture-based date removal with an icon\r

      * Move \"set to current time\" to menu in timer editor\r

      * Low contrasts on labels and icons\r

      \r

      ### Fixed\r

      * Fixed automated screenshot tests\r

      * Swiper\r

      * Storage access permissions\r

      * CastError\r

      * Archived project\r

      * Theme dropdown contrast\r

      * URL launching\r

      * firstDate bug"
