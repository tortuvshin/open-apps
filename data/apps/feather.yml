    body: "Thank you for all your feedback and contributions!\r

      \r

      > [!TIP]\r

      > For `idevice` configuration, you can use
      [Impactor](https://github.com/claration/Impactor?tab=readme-ov-file#pairing-file) for easily
      retrieving a pairing file for installing!\r

      \r

      ## What's Changed\r

      * Added tweak options in default signing options.\r

      * Added ability to search for identifier's in Library @ismailcarlik in
      https://github.com/claration/Feather/pull/652\r

      * Fixed issue in the file enumeration logic, by using the path property instead of method.\r

      * Fixed credit links.\r

      * Fixed duplicate repository in recommended repositories.\r

      \r

      ## New Contributors\r

      * @xiangfeidexiaohuo made their first contribution in
      https://github.com/claration/Feather/pull/634\r

      * @osageling made their first contribution in https://github.com/claration/Feather/pull/642\r

      \r

      **Full Changelog**: https://github.com/claration/Feather/compare/v2.8.2...v2.9.0"
