bestFor:
  - Collecting invoice attachments from supported mailboxes before reimbursement or expense review.
  - Organizing mixed PDF, OFD, and XML invoice files and exporting a consolidated Excel summary.
  - Teams that want uncertain OCR results retained for human verification instead of silently accepted.
whyListed:
  - It is a complete Apache-2.0 desktop application with installable Windows and macOS release assets.
  - It joins mailbox collection, duplicate handling, OCR, file organization, manual review, and spreadsheet export in one workflow.
  - The Python codebase is useful for studying document-processing and desktop automation around real administrative work.
caveats:
  - OCR output and extracted fields should be checked before reimbursement, bookkeeping, accounting, or tax use.
  - When an external OCR or model provider is enabled, relevant invoice images or text are sent to the provider configured by the user.
