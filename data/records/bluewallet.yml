    body: "### New Features\r

      \r

      iOS 26 Liquid Glass design\r

      Import Unchained JSON as a multisig cosigner\r

      Support BC-UR v2 air-gap scanning for hardware wallets (OneKey, Keystone)\r

      Option to redact push notification content\r

      Arkade Lightning push notifications\r

      Enable RBF for single-sig watch-only wallets (HD Bech32)\r

      Human-readable data on transaction status screen\r

      19 new languages, including Filipino, Armenian, Akan, and Sesotho\r

      \r

      ### Improvements\r

      \r

      Renewed Settings UI\r

      Better green success color contrast\r

      Removed GroundControl server URL option from notification settings\r

      Faster transaction fetching for HD wallets\r

      Replaced crypto-js with modern @noble crypto libraries\r

      \r

      ### Fixes\r

      \r

      Startup crash\r

      Amount input lag in RBF custom fee input\r

      Text size on main app views and clipped wallet balance in carousel\r

      QR codes no longer have rounded corners\r

      Signed transaction hex screen stays scrollable\r

      Arkade LNURL payment result now persists\r

      Floating button no longer overlaps the transaction list\r

      Various modal and navigation UX polish\r

      \r

      Under the hood: dependency updates, TypeScript coverage improvements, CI and translation
      tooling fixes.\r

      \r

      ## What's Changed\r

      * FIX: startup crash by @Overtorment in https://github.com/BlueWallet/BlueWallet/pull/8618\r

      * OPS: Bump version by @marcosrdz in https://github.com/BlueWallet/BlueWallet/pull/8621\r

      * fix: no round corners in qrcode by @limpbrains in
      https://github.com/BlueWallet/BlueWallet/pull/8631\r

      * REF: remove GroundControl server URL option from notification settings by @Overtorment in
      https://github.com/BlueWallet/BlueWallet/pull/8636\r

      * ADD: arkade ln pushes by @Overtorment in
      https://github.com/BlueWallet/BlueWallet/pull/8634\r

      * REF: single-pass tx-to-address mapping in HD fetchTransactions by @limpbrains in
      https://github.com/BlueWallet/BlueWallet/pull/8639\r

      * fix(deps): update dependency @noble/secp256k1 to v1.7.2 by @renovate[bot] in
      https://github.com/BlueWallet/BlueWallet/pull/8590\r

      * chore(deps): update actions/checkout action to v6.0.3 by @renovate[bot] in
      https://github.com/BlueWallet/BlueWallet/pull/8643\r

      * Retyui remove dead code by @Overtorment in
      https://github.com/BlueWallet/BlueWallet/pull/8645\r

      * fix(deps): update dependency @arkade-os/sdk to v0.4.33 by @renovate[bot] in
      https://github.com/BlueWallet/BlueWallet/pull/8647\r

      * fix(deps): update dependency @arkade-os/boltz-swap to v0.3.38 by @renovate[bot] in
      https://github.com/BlueWallet/BlueWallet/pull/8646\r

      * fix(deps): update dependency @react-native-vector-icons/ionicons to v13.1.2 by
      @renovate[bot] in https://github.com/BlueWallet/BlueWallet/pull/8650\r

      * fix(deps): update dependency @react-native-vector-icons/fontawesome to v13.1.2 by
