    body: "This is a bug fix, small feature and minor polish release:\r

      \r

      # Minor polish\r

      \r

      * Mouse motion row and focus reporting fixes by @naifalziadna in
      https://github.com/migueldeicaza/SwiftTerm/pull/590\r

      \r

      # Small Feature\r

      \r

      * Let subclasses customize link and key handling by @moshegottlieb in
      https://github.com/migueldeicaza/SwiftTerm/pull/599\r

      \r

      # Fixes\r

      \r

      * Fix Metal renderer crash in packaged apps (Bundle.module fatalErrors) by @mcglothi in
      https://github.com/migueldeicaza/SwiftTerm/pull/593\r

      * Fix unbounded Metal BufferPool growth under constantly-changing content by @klc in
      https://github.com/migueldeicaza/SwiftTerm/pull/598\r

      * Line-accurate scroll wheel with optional sensitivity control (macOS) by @klc in
      https://github.com/migueldeicaza/SwiftTerm/pull/600\r

      * Fixed flipped mouse reporting toggle by @moshegottlieb in
      https://github.com/migueldeicaza/SwiftTerm/pull/601\r

      \r

      ## New Contributors\r

      * @naifalziadna made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/590\r

      * @mcglothi made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/593\r

      * @klc made their first contribution in https://github.com/migueldeicaza/SwiftTerm/pull/598\r

      * @moshegottlieb made their first contribution in
      https://github.com/migueldeicaza/SwiftTerm/pull/599\r

      \r

      **Full Changelog**: https://github.com/migueldeicaza/SwiftTerm/compare/v1.14.0...v1.15.0"
