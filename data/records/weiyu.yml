description: Weiyu is a local-first Windows desktop app that turns readable WeChat messages into searchable daily briefings, with history, speech-to-text, AI-assisted analysis, and a Codex bridge.
summary: A Windows workspace for keeping useful WeChat information searchable instead of buried in chat history. The default workflow is read-only and stores normalized messages and briefings in a local SQLite database.
