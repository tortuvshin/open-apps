bestFor:
  - Studying how a point-of-sale, a kitchen display, and a guest ordering surface share one Flutter codebase and a single embedded backend.
  - Running a small restaurant on hardware the owner controls, where service must continue when the connection does not.
whyListed:
  - The complete MIT-licensed system is public and documents its integrity rules explicitly, including server-computed bill totals and per-order price snapshots.
  - It is a worked example of an offline-first hospitality stack, covering shift floats and drawer counts, five staff roles, ESC/POS receipt printing, and CSV reporting.
caveats:
  - macOS is the only packaged target; Windows and Linux build from the same source but are not released as binaries.
  - Builds are unsigned, so the first launch needs right-click then Open, and the project states it does not pay for an Apple Developer certificate.
  - Guest QR ordering works over the venue's own wi-fi only; public internet ordering is deliberately out of scope to preserve the offline guarantee.
