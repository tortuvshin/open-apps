whyListed:
  - It is a complete GPL-3.0 desktop application with current Windows and macOS release assets.
  - The workflow covers planning, chapter blueprints, drafting, review, and revision rather than only generating isolated passages.
  - Its TypeScript and Electron codebase is useful for studying a cross-platform, local-first creative application.
caveats:
  - Generated prose and continuity still depend on the selected model, project context, and author review.
  - Ollama is optional and must be installed and configured separately when local model use is desired.
