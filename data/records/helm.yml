kind: project
name: Helm
slug: helm
description: Helm is a macOS system toolkit that puts fifteen maintenance and monitoring tools behind one window and one menu-bar item, covering storage, hardware metrics, and clipboard history.
summary: A Flutter macOS app that replaces a folder of single-purpose utilities. It keeps 24 hours of history for memory, CPU, GPU, sensor, battery, and network metrics, and its storage tool spans a squarified treemap explorer, a byte-for-byte duplicate finder, junk cleaning, and APFS snapshot thinning.
sourceDescription: A free, open-source macOS toolkit — fifteen native tools in one window.
