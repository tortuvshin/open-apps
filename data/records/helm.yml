bestFor:
  - Studying how a Flutter desktop app reads real macOS system state, including SMC sensor temperatures, purgeable disk space, and connected-accessory battery levels.
  - Replacing several paid single-purpose Mac utilities with one MIT-licensed app that makes no network calls.
whyListed:
  - Fifteen tools share one window, one design language, and a configurable live menu-bar item, so the codebase shows how a broad utility suite stays coherent.
  - The storage tool is unusually complete for an open-source app, combining a treemap explorer, disjoint category breakdown, junk cleaning with risky items opt-in, and duplicate detection that always keeps one copy.
caveats:
  - macOS 10.15 or later only; there is no Windows or Linux target.
  - Reading SMC sensors and system storage means the app depends on macOS internals that can shift between releases.
  - Cleaning tools move items to the Trash rather than deleting them, so reclaiming the space still needs an explicit empty.
