      - Fixed Android flicker when opening Trade wallet actions (#32617)\r

      - Fixed lending withdrawals showing as \"Smart contract interaction\" in Activity, and grouped
      lending activity under the Transactions filter (removed the Money filter) (#32856)\r

      - Fixed swaps into a native token (e.g. POL, ETH) showing incomplete details and activity list
      rows until the app was restarted (#32848)\r

      - Fixed navigation for address list in Accounts Detail (#32790)\r

      - Fixed dApp connect view content bleeding under the status bar and home indicator on iOS
      (#32837)\r

      - Fixed an issue where some regions showed an incorrect default buy amount after a cold app
      start (#32776)\r

      - Fixed Predictions claim toasts to use claim-specific success copy and avoid showing claimed
      winnings for $0 redemptions (#32506)\r

      - Fixed a confirmation-UI issue where an injected `value` field in a Permit2 signature request
      could display a \"Remove permission\" screen while granting a token allowance (#32758)\r

      - Fixed a bug that caused pay-flow token amounts (Perps, Predict, Money Account, mUSD) to be
      shown in the user's preferred fiat currency instead of USD (#32631)\r

      - Fixed unlock screen showing a raw error message after exceeding Android biometric attempts
      (#32199)\r

      - Fixed lightweight Perps charts failing to continue live updates (#32745)\r

      - Fixed the Predict deposit \"Track\" toast opening the Transactions tab instead of the
      Predict tab (#32730)\r

