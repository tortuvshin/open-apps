    body: "### Added\r

      \r

      - Added a temporary 10-year anniversary app icon (#33285)\r

      - Added limit-order support to the Perps close position flow (gated behind a remote feature
      flag) (#33343)\r

      - Added MetaMask Pay validation that blocks submissions without quotes and handles no-op
      quotes (#33371)\r

      - Added Robinhood default Infura RPC and Quicknode failover (#33094)\r

      - Added existing-user account sync for add-device-to-wallet and improved QR scanning with
      permission prompts, scan-state feedback, error recovery, and OTP verification (#32053)\r

      - Added swap/bridge support for Robinhood Chain (#33110)\r

      - Added privacy mode to money home (#33080)\r

      - Added Predict market card buy-button override support for sponsored campaign flows
      (#32858)\r

      - Added a Batch Sell banner to the Swap source token selector (#33033)\r

      - Added navigation to the transaction detail page when tapping the Money add funds and send
      funds toasts (#33028)\r

      - Added Reg time tag to Predict World Cup buy sheets and game-details outcome cards, and
      improved team-to-advance market display on sport cards (#32981)\r

      - Added deeplink support for all Explore tabs (`?tab=now|macro|rwas|crypto|sports|sites`) and
      full-screen views (`?screen=trending-tokens|sites|favorite-sites|search`) (#32782)\r

      - Added a subtle tilt-driven parallax animation to the Money \"Fund your account\" onboarding
      card (#32892)\r

      - Added First Predict On Us rewards campaign foundation (feature-flagged) (#32857)\r

      - Added recently added market list search pill and section (#32612)\r

      - Added extended soccer Predict market types and improved outcome grouping for halves and
      player goals (#32823)\r

      - Added a shimmer animation to the APY label on the Money account screen (#32955)\r

      - Added support for opening a specific \"What's Happening\" item from a deep link (e.g.
      `metamask://whats-happening?id=<id>`); the item opens in the expanded view and is labelled
      \"Outdated\" when it is no longer in the latest feed (#32881)\r

      - Added the provider company name to benefit cards and the benefit detail page (#30231)\r

      - Added an A/B test for hot tokens, trending tokens, and stocks discovery content on the swap
      zero state (#32775)\r

      - Added streamed swap quotes to QuickBuy so each provider's quote appears as soon as it is
      available, instead of waiting for all providers (gated behind the bridge SSE feature flag)
      (#32575)\r

      - Added fee breakdown disclosure to the Sell trade confirmation screen, showing MetaMask fee,
      Exchange fee, and net Total before users confirm a cash out (#32560)\r

      - Added a mute chip for trader notifications on the leaderboard and profile, and a setup
      prompt when following or unmuting while trading-signal notifications are disabled (#32716)\r

      \r

      ### Changed\r

      \r

      - Updated stablecoin fiat-rate lookups to use the remote stable-tokens configuration
      (#33401)\r

      - Upgraded design system libraries and added pressed state to main trade wallet action menu
      (#33134)\r

      - Gated recently added section behind feature flag (#33049)\r

      - Polished the Perps activity list — cancelled orders are no longer shown in red, limit orders
      show consistent \"$\" amounts and the correct market logo, losses in the Trades tab are shown
      in red, order titles use spaced dashes, and the activity filter sheet is more compact
      (#32998)\r

      - Raised cap of perps watchlist from 10 to 100 (#32977)\r

      - Upgraded on-chain notifications to the v4 Notification API (#32808)\r

      - Disabled CTA swap button for Tron when no network fees retrieved (#32717)\r

      - Display foreground notifications on iOS (#32764)\r

      - Updated Perps market details sections to match the Perps home layout, including consistent
      dividers, headers, spacing, and recent activity list styling (#32924)\r

      - Changed the pooled-staking CTA label from \"Earn\" to \"Stake\" in the token list (#33078)\r

      - Updated the Perps order and close position screen headers to use the same design system
      layout as other Perps market screens, including the asset icon and a redesigned order type
      selector (#32926)\r

      - Improved spacing and hot-token layout on the swap discovery feed zero state (#33058)\r

      - Updated wallet home onboarding and Money onboarding animations (#33052)\r

      - Updated Perps market details candle interval selector and bottom sheet to use the MetaMask
      design system (#32833)\r

      - Updated the onboarding interest questionnaire to match the latest Figma design with a list
      layout, new option categories, and a free-text \"Other\" input sheet (#32670)\r

      - Improved real-time data performance by moving WebSocket connections to a native transport
      with cold-start prewarming (#32472)\r

      - Improved Swaps entry from token pages by focusing the amount input and opening the keypad
      automatically (#32783)\r

      - Bumped `@metamask/tron-wallet-snap` to `^1.31.0` (#33248)\r

      \r

      ### Removed\r

      \r

      - Removed the execute v2 relay strategy from MetaMask Pay transaction handling (#33457)\r

      - Removed Social Leaderboard position PnL arrows (#32899)\r

      - Removed obsolete mUSD Merkl bonus tagging from the popular tokens list (#33044)\r

      \r

      ### Fixed\r

      \r

      - Fixed token fiat amounts incorrectly treating a missing price as `1`, which could show a
      misleading conversion amount (#33462)\r

      - Fixed Popular Today Predict topics opening a duplicate page instead of routing to Trending
      (#33438)\r

      - Fixed mUSD deposits started from the Money home page (#33437)\r

      - Fixed empty Predict related-tag sub-tabs (e.g. \"Other\") showing when they had no active
      markets (#33434)\r

      - Fixed Predict home and feed layout to match Design QA feedback (#33426)\r

      - Fixed Money toasts showing amounts in the user's preferred fiat currency instead of USD
      (#33372)\r

      - Fixed the Money projected 1-year balance showing in the user's preferred fiat currency
      instead of USD (#33381)\r

      - Fixed MetaMask Card \"Avail. balance\" on Money Home changing with the preferred fiat
      currency instead of staying in USD (#33355)\r

      - Fixed pay-flow token amounts (Perps, Predict, Money Account, mUSD) showing a USD symbol with
      the user's preferred-currency numeric value (#33354)\r

      - Fixed the Predict Trending section showing too few markets and an unstable count after
      visiting See all (#33345)\r

      - Fixed the post-trade modal showing an incorrect pending status (#33282)\r

      - Fixed asset names on the \"Earn on your crypto\" rows to display full names instead of
      tickers, consistent with the home page (#33274)\r

      - Fixed Activity getting stuck on a consumed confirmation after submitting a transaction, and
      restored the missing lending deposit token icon (#33269)\r

      - Fixed Activity speed-up/cancel details becoming unavailable, and corrected cancelled/failed
      row categorization and amounts (#33264)\r

      - Fixed a bug in which several empty Tron entries appeared in the Earn list (#33217)\r

      - Fixed a bug where the spam warning modal (\"We've noticed multiple requests\") sometimes
      failed to appear after repeatedly canceling a dapp's requests, leaving the site silently
      blocked with no way to dismiss it (#33183)\r

      - Fixed Swaps getting stuck loading after opening Batch Sell (#33228)\r

      - Fixed swaps numpad background inconsistency in pure black theme (#33077)\r

      - Fixed extra bottom spacing on the Swap screen so scrollable content and the quote footer
      align correctly with the home indicator (#33153)\r

      - Fixed inconsistent bottom border on Trade menu in Pure Black mode (#33142)\r

      - Fixed screenshot warning modal background and border in Pure Black theme (#33133)\r

      - Fixed Money balance info sheet showing a grey content background in Pure Black by letting
      the sheet content be transparent and use the BottomSheet surface (#33145)\r

      - Fixed confirmation toast overlapping modal on first money account deposit (#33124)\r

      - Fixed Y-axis labels and price pill parity on perps Advanced Charts (#32913)\r

      - Fixed Robinhood Chain RPC token detection in the legacy assets controller (#33137)\r

      - Fixed transaction details showing the mUSD token symbol with incorrect casing (MUSD) in step
      descriptions and the Paid with row (#33106)\r

      - Fixed a bug where PayWithRow was hidden during keyboard input for non-addMusd money account
      deposits (convert, card) (#33098)\r

      - Fixed a black band behind disclaimer text in the Money deposit projected balance info sheet
      when Pure Black mode is enabled (#33076)\r

      - Fixed QR signature not working for iOS devices (#33050)\r

      - Fixed a bug where the Perps modify position bottom sheet could leave a stuck overlay after
      dismissing (#33013)\r

      - Fixed ramp orders missing from the new Activity list and Buy/Sell filter when using the v2
      Ramps controller (#32996)\r

      - Fixed blank flash on Token Details chart when switching timeframes with technical indicators
      enabled (#33032)\r

      - Fixed the World Cup Winner market on the Props tab hiding most teams by widening the
      dead-outcome probability filter from 5%/95% to 1%/99% (#33051)\r

      - Fixed an issue on iOS where Terms of Use and Privacy Policy links on the onboarding sheet
      would open and immediately close (#33041)\r

      - Fixed the Money Add funds toast so its copy matches the funding method — \"Depositing\" for
      card/Apple Pay, \"Adding funds\" for mUSD, and \"Converting crypto\" for crypto conversions —
      instead of always showing \"Converting crypto\" (#32967)\r

      - Fixed the mUSD amount being shown inconsistently across the Add funds sheet, the \"Pay
      with\" row, and the deposit amount (#32992)\r

      - Fixed visible dark bands behind menu rows in the Money More bottom sheet when Pure Black
      mode is enabled (#33005)\r

      - Fixed Web Share API and blob/data downloads in the in-app browser on Android, and fixed a
