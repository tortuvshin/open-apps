      Ethereum\" instead of the ambiguous \"Deposited ETH\" (#32921)\r

      - Fixed Agentic CLI dashboard approval not rejecting the pending request when the WebView is
      dismissed before completion (#32874)\r

      - Fixed a bug that could cause a swap or bridge transaction's final status to never sync to
      MetaMask's backend if the app was closed before the transaction had a chance to report as
      submitted (#32936)\r

