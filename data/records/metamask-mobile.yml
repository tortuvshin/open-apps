      - Fixed the keyboard auto-correcting and auto-capitalizing text typed into the Perps market
      search bar (#32948)\r

      - Fixed the Notifications screen header to use a back arrow instead of a close icon (#32920)\r

      - Fixed notification list alignment by moving the unread indicator next to the timestamp
