name: Sync contributors

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec grove sync contributors
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/sync-recent-pulls.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(data): sync contributors"
          file_pattern: data/generated/contributors.json data/generated/repo-stats.json data/generated/recent-pulls.json
