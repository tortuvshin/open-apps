name: Cleanup report

on:
  schedule:
    - cron: "0 5 1-7 * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # bash -o pipefail (GitHub's default for `shell: bash`) makes a failing
      # `grove cleanup` fail the step even though its output is piped to tee.
      - name: Run cleanup
        shell: bash
        run: pnpm exec grove cleanup | tee cleanup-report.md
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ -s cleanup-report.md ]; then
            cat cleanup-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "grove cleanup produced no report; see the Run cleanup step log." >> "$GITHUB_STEP_SUMMARY"
          fi
