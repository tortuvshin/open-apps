name: Sync GitHub

on:
  schedule:
    - cron: "0 3 * * 0"
  # A record merged on Monday used to wait until Sunday for its first
  # metadata sync. With no stars and no pushedAt it sorted last on every
  # order the directory offers — including "Recently added", where it
  # belonged at the top. Sync as soon as a record lands instead.
  push:
    branches: [main]
    paths:
      - "data/records/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec grove sync github
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): sync GitHub metadata"
          title: "Sync GitHub metadata"
          branch: chore/sync-github
          delete-branch: true
